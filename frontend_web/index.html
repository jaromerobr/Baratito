<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      "only light" desactiva el modo oscuro automatico de Chrome en
      Android, que reescribe los colores de cualquier pagina clara y
      convierte el oro en un mostaza sucio. La pagina ya tiene sus
      dos modos propios; no necesita que el navegador invente otro.
    -->
    <meta name="color-scheme" content="only light" />
    <!-- Tinta la barra del navegador con el verde de la cabecera -->
    <meta name="theme-color" content="#12331f" />
    <title>Baratito — Segunda mano, primera opción</title>
    <meta
      name="description"
      content="Marketplace de segunda mano para Loja, Ecuador. Compra y vende entre gente real de tu ciudad."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Nunito:wght@700;800;900&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
